[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-augment"
dynamic = ["version"]
description = "FastAPI 通用代码工具包，跨项目复用"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "zarkhan", email = "hanguangzheng@qq.com" },
]
keywords = ["fastapi", "fastapi-augment", "augment", "web", "framework", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.141.1",
]

[project.optional-dependencies]
uvicorn = [
    "uvicorn[standard]>=0.24.0",
]

sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0.52",
    "python-ulid>=4.0.1",
    "alembic>=1.19.2",
]

orjson = [
    "orjson>=3.10.0",
]

config = [
    "pydantic-settings>=2.15.0",
]

standard = [
    "fastapi-augment[uvicorn,sqlalchemy,orjson,config]"
]

[project.urls]
Homepage = "https://github.com/hgz1989/fastapi_augment"
Repository = "https://github.com/hgz1989/fastapi_augment"
Documentation = "https://github.com/hgz1989/fastapi_augment#readme"

# ======== 新增 CLI 入口 ========
[project.scripts]
fastapi-augment-migrate = "fastapi_augment.db.sqlalchemy.migrate:cli_main"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx2>=2.12.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastapi_augment*"]

[tool.setuptools.package-data]
fastapi_augment = [
    "py.typed",
    "db/sqlalchemy/alembic/*.py",
    "db/sqlalchemy/alembic/*.mako",
    "db/sqlalchemy/alembic/README",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=fastapi_augment --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",       # pycodestyle 基础子集 + pyflakes
    "B", "UP", "SIM", "C4",      # bugbear / pyupgrade / 简化 / 集合字面量
    "RET", "PLR1711", "TRY", "G", "BLE", "RUF",
    "I", "DTZ", "PYI",
]
ignore = [
    "I001",      # import 排序按《代码风格整理.md》人工维护（首次调用顺序 + 末项无逗号）
    "RUF022",    # __all__ 按用途分组注释组织，可读性优于字母序
    "RUF001",    # 中文代码库全角标点属正常书写，不视为混淆字符
    "RUF002",
    "RUF003",
    "TRY003",    # 中文异常消息偏长，不强制抽象异常类
    "G004",      # 与《代码风格整理.md》"统一使用 f-string" 规范冲突
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_augment"]

# ======== 类型检查（mypy） ========
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
no_implicit_optional = true
