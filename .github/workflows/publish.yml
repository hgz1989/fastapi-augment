name: Publish to PyPI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    # PyPI 发布仅 master 分支可执行；其它分支手动触发将直接跳过
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run lint
        run: uvx ruff check src tests

      - name: Run tests
        run: uv run pytest -q

  publish:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 版本守卫需要读取全部 tag

      # 版本守卫：无历史 tag，或代码版本（VERSION 文件）高于最新 tag 时才发布（PyPI 版本不可覆盖）；
      # workflow_dispatch 手动触发不受守卫限制
      - name: Check version change
        id: versioncheck
        run: |
          CODE_VERSION=$(cat VERSION)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$LATEST_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "无历史 tag，按代码版本 $CODE_VERSION 发布"
          else
            TAG_VER="${LATEST_TAG#v}"
            if [ "$(printf '%s\n%s\n' "$CODE_VERSION" "$TAG_VER" | sort -V | tail -n 1)" = "$CODE_VERSION" ] && [ "$CODE_VERSION" != "$TAG_VER" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "代码版本 $CODE_VERSION > 最新 tag $TAG_VER，发布新版本"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "代码版本 $CODE_VERSION <= 最新 tag $TAG_VER，跳过 PyPI 发布"
            fi
          fi

      - name: Setup Python 3.11
        if: steps.versioncheck.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build package
        if: steps.versioncheck.outputs.changed == 'true'
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.versioncheck.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1