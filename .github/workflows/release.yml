# ============================================================
# Release：代码门禁 + 打包源码 + GitHub Release + PyPI
#
# 流程（push master 或手动触发）：
#   Job1 release：
#     版本守卫 → 代码门禁（ruff + pytest）→ 打包 zip/tar.gz → 上传 GitHub Release
#     （tag 由 gh release create 自动创建，失败不留半成品）
#   Job2 publish（needs: release）：
#     仅当 Release 成功后才执行——查 PyPI 是否已有该版本 → 没有则 build 并上传
#     任何一步失败都不会发到 PyPI
#
# 守卫规则：
#   - release job：tag 与 Release 都在且版本一致 → push 跳过 / 手动报错引导升版本
#   - publish job：以 PyPI 线上版本为准（PyPI JSON API 查 404 才上传，天然不重复）
#
# 触发方式：
#   - 推送到 master（自动）
#   - 手动触发（workflow_dispatch）：release=发布新版本；rebuild=重新打包指定版本
#   —— 发布类操作仅 master 分支可执行（job 级 if 校验）
# ============================================================
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 操作类型（release=发布新版本；rebuild=重新打包指定版本）
        type: choice
        required: true
        default: release
        options:
          - release
          - rebuild
      rebuild_tag:
        description: 要重新打包的版本 tag（rebuild 时填写，如 v1.2.3）
        type: string
        required: false

env:
  APP_NAME: fastapi_augment
  PYPI_PROJECT: fastapi-augment

# 同一时间只允许一个发布流程，防止并发
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 发布类操作仅 master 分支可执行；其它分支手动触发将直接跳过
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 拉取全部历史与 tag

      # 版本守卫：tag 与 Release 都存在且版本一致才跳过；缺任一则补齐；
      # rebuild 模式放行；手动触发若版本已完整则报错引导先更新 VERSION
      - name: Check version change
        id: versioncheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE_VERSION=$(cat VERSION)
          TARGET="v$CODE_VERSION"
          if [ "${{ inputs.mode }}" = "rebuild" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "rebuild 模式：直接放行"
          else
            TAG_EXISTS=$(git rev-parse "$TARGET" >/dev/null 2>&1 && echo yes || echo no)
            RELEASE_EXISTS=$(gh release view "$TARGET" >/dev/null 2>&1 && echo yes || echo no)
            echo "版本 $CODE_VERSION：tag=$TAG_EXISTS release=$RELEASE_EXISTS"
            if [ "$TAG_EXISTS" = "yes" ] && [ "$RELEASE_EXISTS" = "yes" ]; then
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "::error::$TARGET 的 tag 与 Release 均已存在，请先在 develop 更新 VERSION 再手动发布"
                exit 1
              else
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "tag 与 Release 均已存在，跳过发布"
              fi
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "缺少 tag 或 Release，继续补齐"
            fi
          fi

      # 发布门禁：确认需要发布（守卫 changed=true）后，发布前最后再验证一次代码——
      # 防止绕过分支保护直接 push master 发布未验证代码；不需要发布时直接跳过
      - name: Setup Python
        if: steps.versioncheck.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.versioncheck.outputs.changed == 'true'
        run: |
          pip install uv
          uv sync --group dev --all-extras

      - name: Run tests
        if: steps.versioncheck.outputs.changed == 'true'
        run: uv run --frozen pytest -q

      - name: Run lint
        if: steps.versioncheck.outputs.changed == 'true'
        run: uvx ruff check src tests

      # ---------- 解析目标版本 ----------
      - name: Resolve target version
        id: resolve
        if: steps.versioncheck.outputs.changed == 'true'
        run: |
          if [ "${{ inputs.mode }}" = "rebuild" ]; then
            python .github/scripts/release_version.py --mode rebuild --rebuild-tag "${{ inputs.rebuild_tag }}"
          else
            python .github/scripts/release_version.py --mode release
          fi

      # 版本一致性校验：目标版本与代码版本不一致时终止并引导
      - name: Check version consistency
        if: steps.resolve.outputs.changed == 'true'
        run: |
          echo "::error::代码版本与目标版本不一致（目标 v${{ steps.resolve.outputs.final_version }}）"
          echo "master 受保护，不允许直接提交代码；请先在 develop 分支更新 VERSION 与 factory.py 的 create_app 默认版本，"
          echo "通过 PR 合并到 master 后重新触发发布"
          exit 1

      # rebuild 模式：检出目标 tag 对应代码重新打包
      - name: Checkout rebuild tag
        if: inputs.mode == 'rebuild'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild_tag }}

      # ---------- 打包源码（打包成功后才上传 Release；失败不留半成品）----------
      - name: Package source
        if: steps.versioncheck.outputs.changed == 'true'
        run: python .github/scripts/release_package.py "${{ steps.resolve.outputs.final_version }}"

      # 上传 Release：tag 由 gh release create 自动创建——Release 成功时 tag 必然存在
      - name: Create or update Release
        if: steps.versioncheck.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.resolve.outputs.final_version }}"
          ASSETS="dist-release/${{ env.APP_NAME }}-${VERSION}.zip dist-release/${{ env.APP_NAME }}-${VERSION}.tar.gz"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" $ASSETS --clobber
          else
            gh release create "v${VERSION}" $ASSETS --title "Release v${VERSION}" --generate-notes
          fi
          echo "Release v${VERSION} 已就绪，资产: $ASSETS"

  # PyPI 发布：必须等 release job（GitHub Release）成功后才执行——
  # Release 任何一步失败，本 job 自动跳过，绝不会发出半成品到 PyPI
  publish:
    needs: release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # PyPI 守卫：以 PyPI 线上版本为准——已存在则跳过（PyPI 版本不可覆盖），404 才上传
      - name: Check PyPI version
        id: pypicheck
        run: |
          EXPECTED=$(cat VERSION)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${{ env.PYPI_PROJECT }}/$EXPECTED/json")
          echo "PyPI 查询 ${{ env.PYPI_PROJECT }}==$EXPECTED -> HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PyPI 已存在版本 $EXPECTED，跳过上传"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PyPI 无版本 $EXPECTED，继续上传"
          fi

      - name: Setup Python 3.11
        if: steps.pypicheck.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build package
        if: steps.pypicheck.outputs.changed == 'true'
        run: |
          pip install --upgrade pip build
          python -m build

      # 版本一致性断言：构建产物版本必须与 VERSION（即 tag 版本）完全一致
      - name: Verify built version matches VERSION
        if: steps.pypicheck.outputs.changed == 'true'
        run: |
          EXPECTED=$(cat VERSION)
          ls dist/ | grep -q "$EXPECTED" || {
            echo "::error::构建产物版本与 VERSION 文件（$EXPECTED）不一致，已中止"
            exit 1
          }
          echo "构建产物版本 $EXPECTED 与 VERSION/tag 一致"

      - name: Publish to PyPI
        if: steps.pypicheck.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
